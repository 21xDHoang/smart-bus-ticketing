<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-d1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Font thương hiệu Be Vietnam Pro nạp ở đây (không @import trong CSS) để mọi màn đều
         có font. Google Fonts tự phục vụ đủ subset latin + vietnamese; display=swap để chữ
         hiện ngay bằng font hệ thống rồi thay khi font tải xong. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Chống nháy màu: đặt chế độ sáng/tối lên <html> TRƯỚC khi React mount.
         Cùng khoá localStorage với src/components/ui/colorMode.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sbt-color-mode');
          if (saved !== 'light' && saved !== 'dark') {
            saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = saved;
          document.documentElement.style.colorScheme = saved;
        } catch (e) {
          /* Không đọc được localStorage — để nguyên chế độ sáng mặc định. */
        }
      })();
    </script>
    <!-- PWA: manifest + icon để "Thêm vào Màn hình chính"; cùng bộ icon với thông báo Web Push.
         theme-color lấy đúng màu thương hiệu (PALETTE.primary trong components/ui/theme.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B5FFF" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Smart Bus" />
    <title>Smart Bus Ticket — Hệ thống đặt vé xe buýt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
